<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gallery-container">
        <div class="gallery">
            <!-- Espacios para imágenes y descripciones -->
            <div class="image-item" id="image-1">
                <img src="" alt="Imagen 1" class="image" id="img-1">
                <input type="file" id="file-1" class="file-input" accept="image/*">
                <textarea id="desc-1" class="description" placeholder="Descripción de la imagen"></textarea>
            </div>
            <div class="image-item" id="image-2">
                <img src="" alt="Imagen 2" class="image" id="img-2">
                <input type="file" id="file-2" class="file-input" accept="image/*">
                <textarea id="desc-2" class="description" placeholder="Descripción de la imagen"></textarea>
            </div>
        </div>
        <button class="update-btn" onclick="updateImages()">Actualizar Datos</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
