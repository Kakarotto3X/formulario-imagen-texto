<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <meta name="description" content="Formulario para subir imágenes con descripción y previsualizarlas al instante.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Galería de Imágenes</h1>
        <p class="subtitle">Selecciona una imagen y escribe una descripción para cada espacio.</p>

        <div class="gallery">
            <div class="image-item" id="image-1">
                <label for="file-1" class="image-label">
                    <img src="" alt="Vista previa de la imagen 1" class="image" id="img-1" hidden>
                    <span class="image-placeholder" id="placeholder-1">Haz clic para subir una imagen</span>
                </label>
                <input type="file" id="file-1" class="file-input" accept="image/*">
                <label for="desc-1" class="visually-hidden">Descripción de la imagen 1</label>
                <textarea id="desc-1" class="description" placeholder="Descripción de la imagen" maxlength="200"></textarea>
                <div class="item-footer">
                    <span class="char-counter" id="counter-1">0/200</span>
                    <button type="button" class="clear-btn" id="clear-1">Limpiar</button>
                </div>
            </div>

            <div class="image-item" id="image-2">
                <label for="file-2" class="image-label">
                    <img src="" alt="Vista previa de la imagen 2" class="image" id="img-2" hidden>
                    <span class="image-placeholder" id="placeholder-2">Haz clic para subir una imagen</span>
                </label>
                <input type="file" id="file-2" class="file-input" accept="image/*">
                <label for="desc-2" class="visually-hidden">Descripción de la imagen 2</label>
                <textarea id="desc-2" class="description" placeholder="Descripción de la imagen" maxlength="200"></textarea>
                <div class="item-footer">
                    <span class="char-counter" id="counter-2">0/200</span>
                    <button type="button" class="clear-btn" id="clear-2">Limpiar</button>
                </div>
            </div>
        </div>

        <button type="button" class="update-btn" id="update-btn">Actualizar Datos</button>
        <p class="feedback-msg" id="feedback-msg" role="status" aria-live="polite"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
